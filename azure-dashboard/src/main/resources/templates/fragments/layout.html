<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<!-- ══════════════════════════════════════════════
     HEAD FRAGMENT
     ══════════════════════════════════════════════ -->
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle}">Azure Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="/img/azure-icon.svg"/>
    <!-- Bootstrap 5 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/main.css"/>
</head>

<!-- ══════════════════════════════════════════════
     SIDEBAR FRAGMENT
     ══════════════════════════════════════════════ -->
<nav th:fragment="sidebar(activePage)" class="sidebar" id="sidebar">

    <!-- Branding -->
    <div class="sidebar-brand">
        <div class="sidebar-logo">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                <path d="M13.5 2L2 8.5V19.5L13.5 26L25 19.5V8.5L13.5 2Z" fill="#0078d4" opacity="0.9"/>
                <path d="M13.5 2L2 8.5L13.5 15L25 8.5L13.5 2Z" fill="#50e6ff" opacity="0.8"/>
                <path d="M2 8.5V19.5L13.5 26V15L2 8.5Z" fill="#0078d4"/>
                <path d="M25 8.5V19.5L13.5 26V15L25 8.5Z" fill="#005a9e"/>
            </svg>
        </div>
        <div class="sidebar-brand-text">
            <span class="brand-title">Microsoft</span>
            <span class="brand-sub">Azure Portal</span>
        </div>
    </div>

    <!-- Navigation -->
    <ul class="sidebar-nav">
        <li class="nav-section-label">MAIN MENU</li>

        <li class="sidebar-nav-item">
            <a th:href="@{/}" th:classappend="${activePage == 'dashboard'} ? 'active'" class="sidebar-nav-link">
                <i class="bi bi-grid-1x2-fill nav-icon"></i>
                <span>Dashboard</span>
                <span th:if="${activePage == 'dashboard'}" class="nav-indicator"></span>
            </a>
        </li>

        <li class="nav-section-label">MONITORING</li>

        <li class="sidebar-nav-item">
            <a th:href="@{/monitor}" th:classappend="${activePage == 'monitor'} ? 'active'" class="sidebar-nav-link">
                <i class="bi bi-activity nav-icon"></i>
                <span>Azure Monitor</span>
                <span class="nav-badge badge-warning">7</span>
            </a>
        </li>

        <li class="sidebar-nav-item">
            <a th:href="@{/cost}" th:classappend="${activePage == 'cost'} ? 'active'" class="sidebar-nav-link">
                <i class="bi bi-currency-dollar nav-icon"></i>
                <span>Cost Management</span>
            </a>
        </li>

        <li class="nav-section-label">INFRASTRUCTURE</li>

        <li class="sidebar-nav-item">
            <a th:href="@{/resources}" th:classappend="${activePage == 'resources'} ? 'active'" class="sidebar-nav-link">
                <i class="bi bi-diagram-3-fill nav-icon"></i>
                <span>Resource Manager</span>
            </a>
        </li>

        <li class="sidebar-nav-item">
            <a th:href="@{/automation}" th:classappend="${activePage == 'automation'} ? 'active'" class="sidebar-nav-link">
                <i class="bi bi-robot nav-icon"></i>
                <span>Automation</span>
            </a>
        </li>

        <li class="nav-section-label">SECURITY</li>

        <li class="sidebar-nav-item">
            <a th:href="@{/security}" th:classappend="${activePage == 'security'} ? 'active'" class="sidebar-nav-link">
                <i class="bi bi-shield-fill-check nav-icon"></i>
                <span>Defender for Cloud</span>
                <span class="nav-badge badge-danger">3</span>
            </a>
        </li>
    </ul>

    <!-- Subscription Info -->
    <div class="sidebar-footer">
        <div class="sub-info">
            <i class="bi bi-building"></i>
            <div>
                <div class="sub-name">Enterprise Dev/Test</div>
                <div class="sub-id">East US · Pay-As-You-Go</div>
            </div>
        </div>
    </div>
</nav>

<!-- ══════════════════════════════════════════════
     TOPBAR FRAGMENT
     ══════════════════════════════════════════════ -->
<header th:fragment="topbar(pageTitle)" class="topbar" id="topbar">
    <div class="topbar-left">
        <button class="sidebar-toggle" id="sidebarToggle" type="button">
            <i class="bi bi-list"></i>
        </button>
        <nav aria-label="breadcrumb" class="topbar-breadcrumb">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="/">Home</a></li>
                <li class="breadcrumb-item active" th:text="${pageTitle}">Page</li>
            </ol>
        </nav>
    </div>
    <div class="topbar-right">
        <div class="topbar-search">
            <i class="bi bi-search"></i>
            <input type="text" placeholder="Search resources, services..." class="search-input"/>
        </div>
        <div class="topbar-actions">
            <button class="topbar-btn" title="Notifications">
                <i class="bi bi-bell"></i>
                <span class="btn-badge">4</span>
            </button>
            <button class="topbar-btn" title="Cloud Shell">
                <i class="bi bi-terminal"></i>
            </button>
            <button class="topbar-btn" title="Settings">
                <i class="bi bi-gear"></i>
            </button>
            <div class="user-avatar" title="admin@contoso.com">
                <span>AD</span>
            </div>
        </div>
    </div>
</header>

</html>
